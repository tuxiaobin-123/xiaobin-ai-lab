# Paste these root-level values into Streamlit Community Cloud > App settings > Secrets.
# Never commit a real secrets.toml file.
APP_PASSWORD = "replace-with-a-new-password"
DATA_MODE = "mock"
WATCH_SYMBOLS = "002261.SZ"
QUOTE_POLL_SECONDS = "1"
DASHBOARD_REFRESH_SECONDS = "1"
MARKET_HOURS_ONLY = "false"
DB_PATH = "/tmp/financial_lab.duckdb"

# Optional real-data mode. Replace the token and set DATA_MODE to ifind_http.
IFIND_REFRESH_TOKEN = ""

# Optional B.AI review. Use a newly rotated key only.
BAI_API_KEY = ""
BAI_BASE_URL = "https://api.b.ai"
BAI_MODEL = "deepseek-v4-pro"
BAI_AUTO_ANALYZE = "false"

